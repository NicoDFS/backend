# Hyperlane bridge on KalyChain (chain id / domain 3890, graph-node chain "kmt").
# Addresses: kalychain-ops/files/kmt-3890/addresses.json (core deployed 2026-08-21, blocks 1615-1676).
# Only KalyChain-side contracts are indexed: the mailbox, its hooks, and the five HypERC20
# synthetics. There is no native (KMT) warp route after the relaunch.
specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Mailbox
    network: kmt
    source:
      address: "0x069255299Bb729399f3CECaBdc73d15d3D10a2A3"
      abi: Mailbox
      startBlock: 1615
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BridgeMessage
        - BridgeStats
        - ChainStats
        - DailyBridgeStats
      abis:
        - name: Mailbox
          file: ../../src/blockchain/abis/bridge/Mailbox.json
        - name: HypERC20
          file: ../../src/blockchain/abis/bridge/HypERC20.json
      eventHandlers:
        - event: Dispatch(indexed address,indexed uint32,indexed bytes32,bytes)
          handler: handleDispatch
        - event: Process(indexed uint32,indexed bytes32,indexed address)
          handler: handleProcess
      file: ./src/mailbox.ts

  - kind: ethereum
    name: MerkleTreeHook
    network: kmt
    source:
      address: "0x3854DDa00aec0161615FEc74E4f7d26bBeA58798"
      abi: MerkleTreeHook
      startBlock: 1615
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BridgeMessage
        - BridgeStats
        - ChainStats
        - DailyBridgeStats
      abis:
        - name: MerkleTreeHook
          file: ../../src/blockchain/abis/bridge/MerkleTreeHook.json
      eventHandlers:
        - event: InsertedIntoTree(bytes32,uint32)
          handler: handleInsertedIntoTree
      file: ./src/merkle-tree-hook.ts

  - kind: ethereum
    name: ValidatorAnnounce
    network: kmt
    source:
      address: "0x1A29Eb3d2b87fCD6611E3C203E0065f1B26bF6F3"
      abi: ValidatorAnnounce
      startBlock: 1615
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Validator
      abis:
        - name: ValidatorAnnounce
          file: ../../src/blockchain/abis/bridge/ValidatorAnnounce.json
      eventHandlers:
        - event: ValidatorAnnouncement(indexed address,string)
          handler: handleAnnouncement
      file: ./src/validator.ts

  - kind: ethereum
    name: USDT
    network: kmt
    source:
      address: "0x6318EcDbae6B469D39C38949eDC671f4bA8A6172"
      abi: HypERC20
      startBlock: 1615
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - TokenTransfer
        - BridgeStats
        - ChainStats
        - DailyBridgeStats
      abis:
        - name: HypERC20
          file: ../../src/blockchain/abis/bridge/HypERC20.json
      eventHandlers:
        - event: SentTransferRemote(indexed uint32,indexed bytes32,uint256)
          handler: handleSentTransferRemote
        - event: ReceivedTransferRemote(indexed uint32,indexed bytes32,uint256)
          handler: handleReceivedTransferRemote
      file: ./src/hyp-erc20.ts

  - kind: ethereum
    name: USDC
    network: kmt
