# KalySwap launchpad (padV3) on KalyChain 3890 (graph-node chain "kmt").
# Addresses: kalychain-ops/files/kmt-3890/addresses.json .launchpad (deployed 2026-08-25, blocks ~175800-175830).
# ABIs are the audited solc-0.8.4 forge build; create() call signatures are unchanged from the previous
# deployment, so the call handlers below still bind. Data-source names are kept so mappings' generated
# imports do not move. The V2 token factories (LiquidityGenerator/Baby/Buyback/AntiBot) were not
# ported to 3890 and are not indexed.
specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TokenFactoryManager
    network: kmt
    source:
      address: "0x380C25A239B1Edf8920f8f80364e3cf0E3dF0fA1"
      abi: TokenFactoryManager
      startBlock: 175800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenFactoryManager
      abis:
        - name: TokenFactoryManager
          file: ../../src/blockchain/abis/launchpad/TokenFactoryManager.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/token-factory-manager.ts

  - kind: ethereum
    name: StandardTokenFactory
    network: kmt
    source:
      address: "0xbcdbe5901E91c8a61ec9F90bC282fbA41a0e7E39"
      abi: StandardTokenFactory
      startBlock: 175800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenFactory
        - Token
        - LaunchpadStats
        - LaunchpadDayData
      abis:
        - name: StandardTokenFactory
          file: ../../src/blockchain/abis/launchpad/StandardTokenFactory.json
        - name: StandardERC20
          file: ../../src/blockchain/abis/launchpad/StandardERC20.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,string,string,uint8,uint256)
          handler: handleStandardTokenCreated
        - event: FeeToUpdated(indexed address,indexed address)
          handler: handleFeeToUpdated
        - event: FlatFeeUpdated(uint256,uint256)
          handler: handleFlatFeeUpdated
      file: ./src/standard-token-factory.ts

  - kind: ethereum
    name: RewardsTokenFactory
    network: kmt
    source:
      address: "0x07149004fd2973fefA1D1772dE05cf9de1D0df32"
      abi: RewardsTokenFactory
      startBlock: 175800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenFactory
        - Token
        - LaunchpadStats
        - LaunchpadDayData
      abis:
        - name: RewardsTokenFactory
          file: ../../src/blockchain/abis/launchpad/RewardsTokenFactory.json
        - name: StandardERC20
          file: ../../src/blockchain/abis/launchpad/StandardERC20.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed address,string,string,uint256)
          handler: handleRewardsTokenCreated
        - event: FeeToUpdated(indexed address,indexed address)
          handler: handleFeeToUpdated
        - event: FlatFeeUpdated(uint256,uint256)
          handler: handleFlatFeeUpdated
      file: ./src/rewards-token-factory.ts

  - kind: ethereum
    name: PresaleFactory
    network: kmt
    source:
      address: "0xa458bDf0eF62a1dF382b1Cf483B24339bF946054"
      abi: PresaleFactory
      startBlock: 175800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PresaleFactory
        - Presale
        - LaunchpadStats
        - LaunchpadDayData
      abis:
        - name: PresaleFactory
          file: ../../src/blockchain/abis/launchpad/PresaleV3Factory.json
        - name: Presale
          file: ../../src/blockchain/abis/launchpad/PresaleV3.json
      callHandlers:
        - function: create(address,address,uint256[2],uint256[2],uint256,uint256,uint256,uint256,uint256)
          handler: handlePresaleCreated
      file: ./src/presale-factory.ts

  - kind: ethereum
    name: FairlaunchFactory
    network: kmt
    source:
      address: "0xaDFdD46404442B6067A74C23ef72d076d1405E9e"
      abi: FairlaunchFactory
      startBlock: 175800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FairlaunchFactory
        - Fairlaunch
        - LaunchpadStats
        - LaunchpadDayData
      abis:
        - name: FairlaunchFactory
          file: ../../src/blockchain/abis/launchpad/FairLaunchV3Factory.json
        - name: Fairlaunch
          file: ../../src/blockchain/abis/launchpad/FairlaunchV3.json
      eventHandlers:
        - event: FairlaunchCreated(indexed address,indexed address,indexed address,address,bool,uint256,uint256)
          handler: handleFairlaunchCreated
        - event: FeeToUpdated(address,address)
          handler: handleFeeToUpdated
        - event: FlatFeeUpdated(uint256,uint256)
          handler: handleFlatFeeUpdated
      file: ./src/fairlaunch-factory.ts
